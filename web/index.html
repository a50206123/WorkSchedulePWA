<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="以 Notion 任務庫為資料來源的時間軸與清單排程工具">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="工作排程">
  <title>工作排程</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img src="./icons/icon.svg" alt="" class="brand-icon" width="28" height="28">
          <h1 class="brand-title">工作排程</h1>
          <span id="demo-badge" class="demo-badge" hidden>示範資料</span>
        </div>

        <nav class="main-nav" aria-label="主要分頁">
          <button type="button" class="nav-tab" data-nav="timeline" aria-current="page">時間軸</button>
          <button type="button" class="nav-tab" data-nav="list">清單</button>
          <button type="button" class="nav-tab" data-nav="settings">設定</button>
        </nav>

        <div class="topbar-actions">
          <button type="button" id="btn-refresh" class="icon-btn" title="重新整理資料" aria-label="重新整理資料">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <polyline points="21 3 21 9 15 9" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="app-main" class="app-main">
      <!-- 內容由 app.js 動態渲染 -->
    </main>
  </div>

  <!-- 任務新增 / 編輯表單 -->
  <div id="task-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-panel" id="task-modal-panel">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">新增任務</h2>
        <button type="button" class="icon-btn" id="modal-close" aria-label="關閉表單">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <form id="task-form" class="modal-body" novalidate>
        <div id="form-error" class="inline-alert inline-alert-error" hidden></div>

        <div class="field">
          <label for="f-title" class="field-label">標題 <span class="req">*</span></label>
          <input type="text" id="f-title" name="title" class="input" placeholder="例如：結構審查討論" required autocomplete="off">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="f-status" class="field-label">任務狀態</label>
            <select id="f-status" name="status" class="input"></select>
          </div>
          <div class="field">
            <label for="f-case" class="field-label">案件（Case List）</label>
            <select id="f-case" name="caseId" class="input"></select>
          </div>
        </div>

        <div class="date-section">
          <div class="date-section-head">
            <label class="checkbox-label">
              <input type="checkbox" id="f-allday" name="allDay">
              <span>整天行程</span>
            </label>
            <button type="button" id="btn-clear-date" class="text-btn">清除日期（僅顯示於清單）</button>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-start-date" class="field-label">開始日期</label>
              <input type="date" id="f-start-date" name="startDate" class="input tabular">
            </div>
            <div class="field" id="wrap-start-time">
              <label for="f-start-time" class="field-label">開始時間</label>
              <input type="time" id="f-start-time" name="startTime" class="input tabular" step="900">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-end-date" class="field-label">結束日期</label>
              <input type="date" id="f-end-date" name="endDate" class="input tabular">
            </div>
            <div class="field" id="wrap-end-time">
              <label for="f-end-time" class="field-label">結束時間</label>
              <input type="time" id="f-end-time" name="endTime" class="input tabular" step="900">
            </div>
          </div>

          <p class="field-hint">時區固定為台北時間（Asia/Taipei）。留空開始日期表示無排程日期，只會出現在清單。</p>
        </div>

        <div id="archive-confirm-bar" class="archive-confirm" hidden>
          <span>確定要封存這項任務嗎？封存後將從目前清單與時間軸移除。</span>
          <div class="archive-confirm-actions">
            <button type="button" id="btn-archive-cancel" class="btn btn-ghost btn-sm">取消</button>
            <button type="button" id="btn-archive-confirm" class="btn btn-danger btn-sm">確認封存</button>
          </div>
        </div>

        <div class="modal-footer">
          <div class="modal-footer-left" id="modal-edit-actions" hidden>
            <a id="link-notion" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm" hidden>在 Notion 開啟</a>
            <button type="button" id="btn-archive" class="btn btn-danger-ghost btn-sm">封存</button>
          </div>
          <div class="modal-footer-right">
            <button type="button" id="btn-cancel" class="btn btn-ghost">取消</button>
            <button type="submit" id="btn-save" class="btn btn-primary">儲存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 月視圖「還有 n 項」當日清單彈窗 -->
  <div id="day-sheet" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="day-sheet-title">
    <div class="modal-panel modal-panel-sm">
      <div class="modal-header">
        <h2 id="day-sheet-title" class="modal-title">當日行程</h2>
        <button type="button" class="icon-btn" id="day-sheet-close" aria-label="關閉當日清單">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div id="day-sheet-body" class="modal-body"></div>
      <div class="modal-footer">
        <button type="button" id="day-sheet-add" class="btn btn-ghost btn-sm">＋ 新增當日任務</button>
        <button type="button" id="day-sheet-goto" class="btn btn-primary btn-sm">前往該日時間軸</button>
      </div>
    </div>
  </div>

  <!-- 拖曳浮動時間提示 -->
  <div id="drag-tooltip" class="drag-tooltip tabular" hidden></div>

  <!-- 吐司訊息容器 -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
